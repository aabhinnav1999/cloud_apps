version: "3.9"

services:
  order-db:
    image: postgres:16
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mySuperSecretKeyForJwtTokenGeneration1234567890
      # inventory- and notification-service run in their own compose files;
      # reach them via the docker host.
      INVENTORY_SERVICE_URL: http://host.docker.internal:8084
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8085:8085"

volumes:
  order_db_data: