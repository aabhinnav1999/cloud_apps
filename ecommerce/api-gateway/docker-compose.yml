version: "3.9"

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      # Each backend service runs in its own compose file; reach them via the host.
      USER_SERVICE_URL: http://host.docker.internal:8081
      PRODUCT_SERVICE_URL: http://host.docker.internal:8082
      CART_SERVICE_URL: http://host.docker.internal:8083
      INVENTORY_SERVICE_URL: http://host.docker.internal:8084
      ORDER_SERVICE_URL: http://host.docker.internal:8085
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
