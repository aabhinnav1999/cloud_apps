server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Central CORS so browsers can call the gateway directly (e.g. in production
      # when the frontend is served from a different origin).
      globalcors:
        cors-configurations:
          "[/**]":
            # Patterns (not allowedOrigins) so any host/port works — the Vite dev
            # server, the nginx frontend on :3000, and the Pi's LAN IP. Required
            # because "*" is illegal in allowedOrigins when allowCredentials is true.
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Route each API path prefix to the owning service. Downstream URLs are
      # overridable via env vars so the same build works locally and in Docker.
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/addresses/**

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/categories/**

        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/cart/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**
