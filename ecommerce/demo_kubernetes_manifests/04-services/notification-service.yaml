apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: aabhinnavdocker/ecommerce-notification-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: MONGO_URI
              value: mongodb://mongodb:27017/notificationdb
          startupProbe:
            httpGet:
              path: /health
              port: 8086
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
