# Demo credentials — the same values used by docker-compose.
# Replace before exposing this cluster to anything real. For production use
# AWS Secrets Manager / External Secrets Operator instead of a committed Secret.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  JWT_SECRET: mySuperSecretKeyForJwtTokenGeneration1234567890
