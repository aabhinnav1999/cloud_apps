apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: aabhinnavdocker/ecommerce-user-service:v1
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        env:
          - name: DB_HOST
            value: user-db
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: userdb
          - name: DB_USERNAME
            value: postgres
          - name: DB_PASSWORD
            value: postgres
          - name: JWT_SECRET
            value: mySuperSecretKeyForJwtTokenGeneration1234567890
          - name: JAVA_TOOL_OPTIONS
            value: "-XX:MaxRAMPercentage=75"
        ports:
        - containerPort: 8081
