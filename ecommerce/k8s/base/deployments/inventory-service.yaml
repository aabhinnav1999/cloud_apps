apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: aabhinnavdocker/ecommerce-inventory-service:v1
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
          - name: DB_HOST
            value: inventory-db
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: inventorydb
          - name: DB_USERNAME
            value: postgres
          - name: DB_PASSWORD
            value: postgres
        ports:
        - containerPort: 8084
