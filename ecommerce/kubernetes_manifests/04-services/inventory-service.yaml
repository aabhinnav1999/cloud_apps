apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: aabhinnavdocker/ecommerce-inventory-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: DB_HOST
              value: inventory-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: inventorydb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_PASSWORD
          # inventory-service exposes "/" as its health check (no /health route).
          startupProbe:
            httpGet:
              path: /
              port: 8084
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8084
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8084
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
