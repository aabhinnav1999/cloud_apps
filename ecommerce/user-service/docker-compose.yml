version: "3.9"

services:
  user-db:
    image: postgres:16
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: .
    container_name: user-service
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mySuperSecretKeyForJwtTokenGeneration1234567890
    ports:
      - "8081:8081"
    networks:
      - ecommerce-net

volumes:
  userdb_data:

networks:
  ecommerce-net:
    driver: bridge